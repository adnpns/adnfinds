
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A+P — Sélection</title>
<style>
  :root {
    --bg: #000000;
    --card-bg: #141414;
    --text: #ffffff;
    --text-muted: #9a9a9a;
    --accent: #0a84ff;
    --success: #34c759;
    --border: #2a2a2a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 80px;
  }
  header {
    position: sticky;
    top: 0;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(10px);
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    z-index: 10;
  }
  header h1 {
    margin: 0 0 8px 0;
    font-size: 20px;
    font-weight: 600;
  }
  .status-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
    color: var(--text-muted);
    flex-wrap: wrap;
  }
  .status-bar button {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 13px;
    color: var(--accent);
    cursor: pointer;
  }
  .cols-tabs {
    display: flex;
    gap: 6px;
    margin-top: 10px;
  }
  .cols-tabs button {
    background: rgba(255,255,255,0.08);
    border: none;
    color: var(--text);
    padding: 5px 12px;
    border-radius: 14px;
    font-size: 12px;
    cursor: pointer;
  }
  .cols-tabs button.active {
    background: white;
    color: #000;
    font-weight: 600;
  }
  .search-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .search-row input[type="search"] {
    flex: 1;
    min-width: 160px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 13px;
    background: #1a1a1a;
    color: var(--text);
  }
  .search-row select {
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 13px;
    background: #1a1a1a;
    color: var(--text);
  }
  .search-row select.filled {
    border-color: var(--accent);
    color: var(--accent);
  }

  #error-screen {
    max-width: 480px;
    margin: 60px auto;
    padding: 24px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    text-align: center;
  }

  main { max-width: 1400px; margin: 0 auto; padding: 12px 6px 60px; }

  .grid {
    display: grid;
    gap: 3px;
  }
  .grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
  .grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
  .grid.cols-6 { grid-template-columns: repeat(6, 1fr); }
  @media (max-width: 900px) {
    .grid.cols-4, .grid.cols-6 { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 560px) {
    .grid.cols-4, .grid.cols-6 { grid-template-columns: repeat(2, 1fr); }
  }

  .card {
    background: var(--card-bg);
    overflow: hidden;
  }
  .card img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    background: #1a1a1a;
    display: block;
  }
  .card .no-image {
    width: 100%;
    aspect-ratio: 1;
    background: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 11px;
  }
  .card-body { padding: 8px 9px 10px; }
  .card-title {
    font-size: 12px;
    font-weight: 600;
    margin: 0 0 3px;
    line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-meta {
    font-size: 10px;
    color: var(--text-muted);
    margin-bottom: 8px;
  }
  .vinted-link {
    display: inline-block;
    font-size: 11px;
    color: var(--accent);
    text-decoration: none;
    margin: -2px 0 8px;
    font-weight: 600;
  }
  .vinted-link:hover { text-decoration: underline; }
  .field-group {
    margin-bottom: 6px;
  }
  .field-group-label {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text-muted);
    margin-bottom: 3px;
    font-weight: 600;
  }
  .select-row {
    display: flex;
    gap: 4px;
  }
  .select-row select {
    flex: 1;
    min-width: 0;
    font-size: 11px;
    padding: 5px 6px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #1a1a1a;
    color: var(--text);
  }
  .select-row select.filled {
    border-color: var(--success);
    background: #0d1f10;
  }

  #loading, #empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }
  .spinner {
    width: 28px; height: 28px;
    border: 3px solid var(--border);
    border-top-color: var(--text);
    border-radius: 50%;
    margin: 0 auto 12px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #fff;
    color: #000;
    padding: 10px 20px;
    border-radius: 24px;
    font-size: 14px;
    opacity: 0;
    transition: all 0.3s ease;
    pointer-events: none;
    z-index: 100;
    white-space: nowrap;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="error-screen" class="hidden">
  <h2>Lien incomplet</h2>
  <p>Ce lien doit être ouvert tel qu'il a été envoyé par Adrien (il contient les informations de connexion au dossier).</p>
</div>

<div id="app" class="hidden">
  <header>
    <h1 id="header-title">🗂️ A+P</h1>
    <div class="status-bar">
      <span id="status-text">Chargement…</span>
      <button id="btn-refresh">↻ Rafraîchir</button>
    </div>
    <div class="cols-tabs">
      <button data-cols="2">2 colonnes</button>
      <button data-cols="4" class="active">4 colonnes</button>
      <button data-cols="6">6 colonnes</button>
    </div>
    <div class="search-row">
      <input type="search" id="input-search" placeholder="🔍 Chercher par titre ou marque…">
      <select id="filter-category"><option value="">Catégorie : toutes</option></select>
      <select id="filter-subcategory" disabled><option value="">Sous-catégorie</option></select>
    </div>
  </header>
  <main>
    <div id="loading">
      <div class="spinner"></div>
      Chargement des pièces…
    </div>
    <div id="empty" class="hidden">
      Aucune pièce dans ce dossier pour le moment.
    </div>
    <div id="grid" class="grid cols-4 hidden"></div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
const CATEGORIE_MAP = {
  'Jackets': {
    'Blazers': [], 'Bombers': [], 'Denim Jackets': [], 'Leather jacket': [],
    'Overcoats': [], 'Puffers': [], 'Vests': []
  },
  'Tops': {
    'Tees': ['Graphic tee', 'Plain tee'],
    'Shirts': ['Casual shirt', 'Dress shirt', 'Flannel'],
    'Jerseys': []
  },
  'Sweaters': {
    'Knits': [], 'Crenecks': [], 'Hoodies': [], 'Zip Hoodies': []
  },
  'Bottoms': {
    '5 pockets pants': [], 'Denim pants': [], 'Dress pants': [],
    'Shorts': [], 'Work pants': [], 'Tracksuits': []
  },
  'Shoes': {
    'Dress shoes': [], 'Boots': [], 'Sandals': [], 'Sneakers': []
  },
  'Accessories': {
    'Bags': ['Backpack', 'Crossbody', 'Shoulder bag', 'Tote'],
    'Hats': ['Beanie', 'Bucket hat', 'Cap'],
    'Jewellery': ['Bracelet', 'Charm', 'Keychain', 'Necklace', 'Ring', 'Watch'],
    'Belts': ['Chain belt', 'Leather belt', 'Western buckle'],
    'Scarfs': [], 'Sunglasses': []
  },
  'Home': {
    'Furniture': [], 'Décoration': []
  },
  'Sport': {
    'Autre': []
  },
  'Other': {
    'Autre': []
  }
};
const CATEGORIES_PRINCIPALES = Object.keys(CATEGORIE_MAP).sort((a, b) => a.localeCompare(b));
function sousCategoriesFor(principale) {
  const map = CATEGORIE_MAP[principale] || {};
  return Object.keys(map).sort((a, b) => a.localeCompare(b));
}
function sousSousCategoriesFor(principale, secondaire) {
  const map = CATEGORIE_MAP[principale] || {};
  const list = map[secondaire] || [];
  return [...list].sort((a, b) => a.localeCompare(b));
}

const params = new URLSearchParams(window.location.search);
const API_URL = params.get('apiUrl');
const DOSSIER_ID = params.get('dossierId');
const DOSSIER_NAME = params.get('dossierName') || 'Sélection';

const errorScreen = document.getElementById('error-screen');
const appScreen = document.getElementById('app');
const gridEl = document.getElementById('grid');
const loadingEl = document.getElementById('loading');
const emptyEl = document.getElementById('empty');
const statusText = document.getElementById('status-text');
const headerTitle = document.getElementById('header-title');
const toastEl = document.getElementById('toast');
const searchInput = document.getElementById('input-search');
const categorySelect = document.getElementById('filter-category');
const subcategorySelect = document.getElementById('filter-subcategory');

let allRecords = [];
let searchQuery = '';
let categoryFilter = '';
let subcategoryFilter = '';

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 2000);
}

function parseDossiersField(value) {
  return String(value || '').split(',').map(s => s.trim()).filter(Boolean);
}

function optionsHtml(list, selected) {
  return `<option value="">—</option>` + list.map(v =>
    `<option value="${v}" ${v === selected ? 'selected' : ''}>${v}</option>`
  ).join('');
}

async function apiGet(action, extraParams = {}) {
  const qs = new URLSearchParams({ action, ...extraParams }).toString();
  const res = await fetch(`${API_URL}?${qs}`);
  if (!res.ok) throw new Error(`Erreur API (${res.status})`);
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

async function apiPost(action, body = {}) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, ...body })
  });
  if (!res.ok) throw new Error(`Erreur API (${res.status})`);
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

async function loadRecords() {
  const data = await apiGet('listPieces', { filter: 'dossier', dossierId: DOSSIER_ID });
  allRecords = data.records.map(r => ({
    id: r.rowIndex,
    fields: { ...r.fields, Folders: parseDossiersField(r.fields.Folders) }
  }));
  allRecords.sort((a, b) => String(b.fields.find_id || '').localeCompare(String(a.fields.find_id || '')));
}

function applyFilters() {
  let out = allRecords;
  if (searchQuery.trim()) {
    const q = searchQuery.trim().toLowerCase();
    out = out.filter(r => {
      const title = String(r.fields.Title || '').toLowerCase();
      const brand = String(r.fields.Brand || '').toLowerCase();
      return title.includes(q) || brand.includes(q);
    });
  }
  if (categoryFilter) out = out.filter(r => r.fields.Category === categoryFilter);
  if (subcategoryFilter) out = out.filter(r => r.fields.Subcategory === subcategoryFilter);
  return out;
}

async function patchRecord(recordId, fields) {
  return apiPost('updatePiece', { rowIndex: recordId, fields });
}

const FIELD_LABELS = {
  Category: 'Catégorie',
  Subcategory: 'Sous-catégorie',
  'Sub-Subcategory': 'Sous-sous-catégorie'
};

async function updateCategorie(recordId, fieldName, value, selectEl) {
  selectEl.disabled = true;
  try {
    await patchRecord(recordId, { [fieldName]: value || null });
    selectEl.classList.toggle('filled', !!value);
    if (value) showToast(`✓ ${FIELD_LABELS[fieldName] || fieldName} mise à jour`);
    const rec = allRecords.find(r => r.id === recordId);
    if (rec) rec.fields[fieldName] = value;
  } catch (e) {
    showToast(`Erreur : ${e.message}`);
  } finally {
    selectEl.disabled = false;
  }
}

function buildCard(record) {
  const fields = record.fields;
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.recordId = record.id;

  const imgUrl = fields.Images_Link || null;

  card.innerHTML = `
    ${imgUrl
      ? `<img src="${imgUrl}" alt="${fields.Title || ''}" loading="lazy">`
      : `<div class="no-image">Pas d'image</div>`}
    <div class="card-body">
      <p class="card-title">${fields.Title || fields.find_id || 'Sans titre'}</p>
      <p class="card-meta">${fields.find_id || ''}${fields.Brand ? ' · ' + fields.Brand : ''}</p>
      ${fields.Vinted_Link
        ? `<a href="${fields.Vinted_Link}" target="_blank" rel="noopener" class="vinted-link">🔗 Voir sur Vinted</a>`
        : ''}

      <div class="field-group">
        <div class="field-group-label">Catégorie</div>
        <div class="select-row">
          <select class="cat-principale ${fields.Category ? 'filled' : ''}">
            ${optionsHtml(CATEGORIES_PRINCIPALES, fields.Category)}
          </select>
          <select class="cat-secondaire ${fields.Subcategory ? 'filled' : ''}" ${!fields.Category ? 'disabled' : ''}>
            ${optionsHtml(sousCategoriesFor(fields.Category), fields.Subcategory)}
          </select>
        </div>
        <div class="select-row" style="margin-top:4px;">
          <select class="cat-tertiaire ${fields['Sub-Subcategory'] ? 'filled' : ''}" ${sousSousCategoriesFor(fields.Category, fields.Subcategory).length === 0 ? 'disabled' : ''}>
            ${optionsHtml(sousSousCategoriesFor(fields.Category, fields.Subcategory), fields['Sub-Subcategory'])}
          </select>
        </div>
      </div>
    </div>
  `;

  const selPrincipale = card.querySelector('.cat-principale');
  const selSecondaire = card.querySelector('.cat-secondaire');
  const selTertiaire = card.querySelector('.cat-tertiaire');

  selPrincipale.addEventListener('change', async () => {
    const newPrincipale = selPrincipale.value;
    selSecondaire.innerHTML = optionsHtml(sousCategoriesFor(newPrincipale), '');
    selSecondaire.disabled = !newPrincipale;
    selSecondaire.classList.remove('filled');
    selTertiaire.innerHTML = optionsHtml([], '');
    selTertiaire.disabled = true;
    selTertiaire.classList.remove('filled');
    await updateCategorie(record.id, 'Category', newPrincipale, selPrincipale);
    await updateCategorie(record.id, 'Subcategory', '', selSecondaire);
    await updateCategorie(record.id, 'Sub-Subcategory', '', selTertiaire);
  });

  selSecondaire.addEventListener('change', async () => {
    const newSecondaire = selSecondaire.value;
    const options = sousSousCategoriesFor(selPrincipale.value, newSecondaire);
    selTertiaire.innerHTML = optionsHtml(options, '');
    selTertiaire.disabled = options.length === 0;
    selTertiaire.classList.remove('filled');
    await updateCategorie(record.id, 'Subcategory', newSecondaire, selSecondaire);
    await updateCategorie(record.id, 'Sub-Subcategory', '', selTertiaire);
  });

  selTertiaire.addEventListener('change', () => updateCategorie(record.id, 'Sub-Subcategory', selTertiaire.value, selTertiaire));

  return card;
}

function renderGrid() {
  const visible = applyFilters();

  if (allRecords.length === 0) {
    gridEl.classList.add('hidden');
    emptyEl.classList.remove('hidden');
    emptyEl.textContent = 'Aucune pièce dans ce dossier pour le moment.';
    statusText.textContent = 'Rien à afficher';
    return;
  }
  if (visible.length === 0) {
    gridEl.classList.add('hidden');
    emptyEl.classList.remove('hidden');
    emptyEl.textContent = '🔍 Aucun résultat pour ces filtres.';
    statusText.textContent = '0 pièce';
    return;
  }
  emptyEl.classList.add('hidden');
  gridEl.classList.remove('hidden');
  gridEl.innerHTML = '';
  const fragment = document.createDocumentFragment();
  visible.forEach(record => fragment.appendChild(buildCard(record)));
  gridEl.appendChild(fragment);
  statusText.textContent = `${visible.length} pièce${visible.length > 1 ? 's' : ''}`;
}

function populateFilterSelects() {
  categorySelect.innerHTML = '<option value="">Catégorie : toutes</option>' +
    CATEGORIES_PRINCIPALES.map(c => `<option value="${c}">${c}</option>`).join('');
  categorySelect.classList.toggle('filled', !!categoryFilter);

  const subOptions = categoryFilter ? sousCategoriesFor(categoryFilter) : [];
  subcategorySelect.innerHTML = '<option value="">Sous-catégorie</option>' +
    subOptions.map(sc => `<option value="${sc}">${sc}</option>`).join('');
  subcategorySelect.disabled = !categoryFilter;
  subcategorySelect.classList.toggle('filled', !!subcategoryFilter);
}

async function refreshAll() {
  loadingEl.classList.remove('hidden');
  gridEl.classList.add('hidden');
  emptyEl.classList.add('hidden');
  statusText.textContent = 'Chargement…';
  try {
    await loadRecords();
    populateFilterSelects();
    loadingEl.classList.add('hidden');
    renderGrid();
  } catch (e) {
    loadingEl.classList.add('hidden');
    statusText.textContent = '';
    alert(`Erreur de chargement : ${e.message}`);
  }
}

document.getElementById('btn-refresh').addEventListener('click', refreshAll);

document.querySelectorAll('.cols-tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.cols-tabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    gridEl.className = 'grid cols-' + btn.dataset.cols;
  });
});

let searchDebounceTimer = null;
searchInput.addEventListener('input', () => {
  clearTimeout(searchDebounceTimer);
  searchDebounceTimer = setTimeout(() => {
    searchQuery = searchInput.value;
    renderGrid();
  }, 150);
});

categorySelect.addEventListener('change', () => {
  categoryFilter = categorySelect.value;
  subcategoryFilter = '';
  populateFilterSelects();
  renderGrid();
});

subcategorySelect.addEventListener('change', () => {
  subcategoryFilter = subcategorySelect.value;
  subcategorySelect.classList.toggle('filled', !!subcategoryFilter);
  renderGrid();
});

if (API_URL && DOSSIER_ID) {
  headerTitle.textContent = '🗂️ ' + DOSSIER_NAME;
  appScreen.classList.remove('hidden');
  refreshAll();
} else {
  errorScreen.classList.remove('hidden');
}
</script>

</body>
</html>
