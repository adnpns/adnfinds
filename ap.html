<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>A+P · Finds</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0c0b0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap">
<style>
/* Sélection partagée Adrien + Pauline : coups de cœur, prix, statut d'achat.
   Même direction artistique que Finds et adrienpons.com. */
:root {
  --void: #0c0b0a;
  --void-alt: #151312;
  --raise: #1c1a18;
  --ink: #e9e4d8;
  --ink-soft: #8c8577;
  --line: #2e2b26;
  --line-strong: #4a453c;
  --accent: #d97a4f;
  --adrien: #d97a4f;
  --pauline: #c99be0;
  --s-voir: #8c8577;
  --s-attente: #e3b75a;
  --s-achete: #8fb58a;
  --s-recu: #6fa8c9;
  --danger: #e0705f;
  --mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --gutter: clamp(14px, 3vw, 32px);
  --card-min: 200px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--void); color: var(--ink); }
body { font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; padding-bottom: env(safe-area-inset-bottom, 0px); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
.soft { color: var(--ink-soft); }
.hidden { display: none !important; }

header { padding: calc(18px + env(safe-area-inset-top, 0px)) var(--gutter) 0; border-bottom: 1px solid var(--line); }
.row1 { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(30px, 5vw, 44px); line-height: 1; margin: 0; }
h1 small { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; color: var(--ink-soft); margin-left: 10px; vertical-align: middle; }
.tools { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.btn { background: transparent; border: 1px solid var(--line-strong); padding: 7px 11px; font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink); white-space: nowrap; text-decoration: none; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: .4; }
.status-txt { font-family: var(--mono); font-size: 11px; color: var(--ink-soft); }
.budget { margin-top: 14px; padding: 10px 12px; border: 1px solid color-mix(in srgb, var(--s-attente) 45%, transparent); color: var(--s-attente); font-family: var(--mono); font-size: 12px; letter-spacing: .04em; }

.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 14px 0; }
.search { flex: 1 1 220px; display: flex; gap: 8px; align-items: center; border-bottom: 1px solid var(--line-strong); min-width: 0; }
.search input { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; padding: 6px 0; font-family: var(--serif); font-size: 16px; }
.chip { flex: none; background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; font-size: 13px; color: var(--ink-soft); }
.chip b { font-family: var(--mono); font-weight: 400; font-size: 11px; margin-left: 5px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--void); border-color: var(--ink); }
.chip.fa[aria-pressed="true"] { background: var(--adrien); border-color: var(--adrien); }
.chip.fp[aria-pressed="true"] { background: var(--pauline); border-color: var(--pauline); }
.chip i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
select.f { background: var(--void); border: 1px solid var(--line); padding: 6px 8px; font-family: var(--mono); font-size: 11px; max-width: 180px; }
select.f.on { border-color: var(--accent); color: var(--accent); }
.chiprow { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 14px; }
.chiprow::-webkit-scrollbar { display: none; }

main { padding: 20px var(--gutter) 100px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--card-min), 1fr)); gap: 26px 16px; }
.card { display: grid; gap: 8px; align-content: start; min-width: 0; transition: opacity .25s; }
.card.gone { opacity: 0; }
.ph { position: relative; aspect-ratio: 4 / 5; background: var(--void-alt); overflow: hidden; }
.ph > a { display: block; height: 100%; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph .fav { position: absolute; top: 8px; display: flex; gap: 6px; left: 8px; }
.favbtn { width: 32px; height: 32px; border-radius: 50%; border: 1px solid rgba(233,228,216,.6); background: rgba(12,11,10,.55); font-family: var(--mono); font-size: 12px; color: var(--ink); display: grid; place-items: center; backdrop-filter: blur(4px); }
.favbtn.a.on { background: var(--adrien); border-color: var(--adrien); color: var(--void); }
.favbtn.p.on { background: var(--pauline); border-color: var(--pauline); color: var(--void); }
.favbtn:disabled { opacity: .5; }
.del { position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; border-radius: 50%; border: 1px solid rgba(233,228,216,.35); background: rgba(12,11,10,.55); color: var(--ink-soft); font-size: 14px; }
.del.confirm { width: auto; border-radius: 16px; padding: 0 10px; background: var(--danger); border-color: var(--danger); color: var(--void); font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; }
.meta { display: grid; gap: 2px; min-width: 0; }
.meta .b { font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta .t { font-family: var(--serif); font-size: 15px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.ps { width: 100%; background: transparent; border: 0; border-bottom: 1px solid var(--line); padding: 6px 0; font-family: var(--mono); font-size: 12px; outline: none; }
.ps:focus { border-bottom-color: var(--accent); }
.ps::placeholder { color: var(--ink-soft); }
.st { display: flex; gap: 4px; flex-wrap: wrap; }
.st button { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 3px 8px; font-size: 11.5px; color: var(--ink-soft); }
.st button i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
.st button[aria-pressed="true"] { color: var(--ink); border-color: currentColor; }
details.cat summary { list-style: none; cursor: pointer; font-family: var(--mono); font-size: 10.5px; letter-spacing: .04em; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
details.cat summary::-webkit-details-marker { display: none; }
details.cat summary::before { content: "+ "; color: var(--accent); }
details.cat[open] summary::before { content: "− "; }
details.cat select { width: 100%; margin-top: 6px; background: var(--void); border: 1px solid var(--line); padding: 5px; font-size: 12px; }
.dens-s { --card-min: 140px; }
.dens-s .meta .t, .dens-s details.cat, .dens-s .st { display: none; }
.dens-l { --card-min: 300px; }
.empty { padding: 70px 0; text-align: center; font-family: var(--serif); font-size: 20px; color: var(--ink-soft); }

.toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 30px); opacity: 0; z-index: 70; background: var(--ink); color: var(--void); padding: 9px 14px; font-family: var(--mono); font-size: 11px; letter-spacing: .06em; transition: opacity .2s, transform .2s; pointer-events: none; max-width: calc(100% - 24px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.err { background: var(--danger); }
.recapbox { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: rgba(0,0,0,.65); padding: 16px; }
.recapbox div { background: var(--void-alt); border: 1px solid var(--line-strong); padding: 18px; width: min(560px, 100%); display: grid; gap: 12px; }
.recapbox textarea { width: 100%; min-height: 260px; background: var(--void); color: var(--ink); border: 1px solid var(--line); font-family: var(--mono); font-size: 12px; padding: 10px; }
@media (max-width: 640px) {
  :root { --card-min: 150px; }
  .grid { gap: 22px 10px; }
  .tools { margin-left: 0; }
  .favbtn, .del { width: 30px; height: 30px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <div class="row1">
    <h1 id="title">A+P<small id="count"></small></h1>
    <div class="tools">
      <span class="status-txt" id="status">Chargement…</span>
      <button class="btn" id="btn-refresh">Actualiser</button>
      <button class="btn" id="btn-recap">Copier le récap</button>
      <button class="btn" id="btn-density">Vignettes M</button>
      <a class="btn" href="./ajout.html">+ Ajouter</a>
    </div>
  </div>
  <div class="budget hidden" id="budget"></div>
  <div class="filters">
    <label class="search" for="q"><span class="mono soft">Chercher</span><input id="q" type="search" placeholder="titre, marque…" autocomplete="off"></label>
    <button class="chip fa" id="f-a" aria-pressed="false">Coups de cœur A<b id="n-a"></b></button>
    <button class="chip fp" id="f-p" aria-pressed="false">Coups de cœur P<b id="n-p"></b></button>
    <select class="f" id="f-cat" aria-label="Catégorie"></select>
  </div>
  <div class="chiprow" id="f-status" aria-label="Statut"></div>
</header>

<main>
  <div class="empty" id="empty">Chargement de la sélection…</div>
  <div class="grid" id="grid"></div>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
const DEFAULT_API = 'https://script.google.com/macros/s/AKfycbypp-fgmCsLZAovVvFrhbDCRDBrqie6_o3Fm7MAFTmOVd9dGr7ic7jb_fk1A1K_NoXlOw/exec';
const DEFAULT_FOLDER = 'd_mtok1nd7844'; // A+P
const params = new URLSearchParams(location.search);
// Les liens déjà envoyés (avec apiUrl, dossierId, dossierName) continuent de marcher ;
// sans paramètres, la page ouvre directement A+P.
const API_URL = params.get('apiUrl') || DEFAULT_API;
const DOSSIER_ID = params.get('dossierId') || DEFAULT_FOLDER;
const DOSSIER_NAME = params.get('dossierName') || 'A+P';

const CATEGORIE_MAP = {
  'Jackets': {
    'Blazers': [],
    'Bombers': [],
    'Varsity / Teddy': [],
    'Denim Jackets': [],
    'Leather jacket': ['Biker', 'Blouson', 'Coat'],
    'Track jackets': [],
    'Workwear': [],
    'Overcoats': [],
    'Puffers': [],
    'Vests': ['Down vest', 'Gilet']
  },
  'Tops': {
    'Tees': ['Graphic tee', 'Plain tee', 'Band / Movie tee'],
    'Shirts': ['Casual shirt', 'Dress shirt', 'Flannel', 'Western', 'Hawaiian'],
    'Polos': [],
    'Jerseys': ['Football', 'Basketball / NBA', 'Rugby', 'Other sport']
  },
  'Sweaters': {
    'Knits': ['Wool / Cashmere', 'Cardigan'],
    'Crewnecks': [],
    'Hoodies': [],
    'Zip Hoodies': [],
    'Fleece': []
  },
  'Bottoms': {
    '5 pockets pants': [],
    'Denim pants': [],
    'Dress pants': [],
    'Shorts': [],
    'Work pants': [],
    'Tracksuits': [],
    'Skirts': []
  },
  'Shoes': {
    'Dress shoes': [],
    'Boots': [],
    'Sandals': [],
    'Sneakers': []
  },
  'Accessories': {
    'Bags': ['Backpack', 'Crossbody', 'Shoulder bag', 'Tote'],
    'Hats': ['Beanie', 'Bucket hat', 'Cap'],
    'Jewellery': ['Bracelet', 'Charm', 'Keychain', 'Necklace', 'Ring', 'Watch'],
    'Belts': ['Chain belt', 'Leather belt', 'Western buckle'],
    'Scarfs': [],
    'Sunglasses': [],
    'Gloves': [],
    'Umbrellas': []
  },
  'Home': {
    'Furniture': [],
    'Décoration': [],
    'Textile': [],
    'Games': [],
    'Tableware': []
  },
  'Collectibles': {
    'Pins': [],
    'Cards / Pokémon': [],
    'Football memorabilia': []
  },
  'Sport': {
    'Autre': []
  },
  'Other': {
    'Autre': []
  }
};
const CATS = Object.keys(CATEGORIE_MAP);
const subsOf = c => Object.keys(CATEGORIE_MAP[c] || {});
const subsubsOf = (c, s) => (CATEGORIE_MAP[c] || {})[s] || [];

const STATUSES = [
  { v: 'À voir', c: 'var(--s-voir)' },
  { v: "En attente d'achat", c: 'var(--s-attente)' },
  { v: 'Acheté', c: 'var(--s-achete)' },
  { v: 'Reçu', c: 'var(--s-recu)' },
];
const statusOf = f => f.Status || 'À voir';
const truthy = v => ['true', '1', 'oui', 'yes'].includes(String(v || '').trim().toLowerCase());
const favA = f => truthy(f['Favorite A']);
const favP = f => truthy(f['Favorite P']);

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function img(url, size) {
  const m = String(url || '').match(/[?&]id=([\w-]+)/) || String(url || '').match(/\/d\/([\w-]+)/);
  if (m && /drive\.google/.test(url)) return `https://drive.google.com/thumbnail?id=${m[1]}&sz=w${size}`;
  return url || '';
}
let toastTimer;
function toast(msg, err) {
  $('toast').textContent = msg; $('toast').classList.toggle('err', !!err); $('toast').classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => $('toast').classList.remove('show'), err ? 5000 : 2000);
}
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};

// ---------- API ----------
async function apiGet(qs) {
  for (let i = 0; i < 3; i++) {
    try {
      const res = await fetch(`${API_URL}?${new URLSearchParams(qs)}`, { credentials: 'omit' });
      if (!res.ok) throw new Error(`erreur ${res.status}`);
      const d = JSON.parse(await res.text());
      if (d.error) throw new Error(d.error);
      return d;
    } catch (e) {
      if (i === 2) throw e;
      await new Promise(r => setTimeout(r, 3000 * (i + 1)));
    }
  }
}
async function apiPost(action, body) {
  const res = await fetch(API_URL, { method: 'POST', credentials: 'omit', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, ...body }) });
  if (!res.ok) throw new Error(`erreur ${res.status}`);
  const d = JSON.parse(await res.text());
  if (d.error) throw new Error(d.error);
  return d;
}

// ---------- État ----------
const CACHE_KEY = 'ap_cache_' + DOSSIER_ID;
const prefs = store.get('ap_prefs_v2', {});
const S = { recs: [], q: '', fa: false, fp: false, cat: '', status: '' };

function ingest(raw) {
  // Sécurité : on ne garde que les pièces du dossier, même si l'API renvoyait plus.
  S.recs = raw.map(r => ({ id: r.rowIndex, f: r.fields }))
    .filter(r => String(r.f.Folders || '').split(',').map(s => s.trim()).includes(DOSSIER_ID))
    .sort((a, b) => b.id - a.id);
}
function save() { store.set(CACHE_KEY, S.recs); }

async function load() {
  $('status').textContent = 'Mise à jour…';
  $('btn-refresh').disabled = true;
  try {
    const d = await apiGet({ action: 'listPieces', filter: 'dossier', dossierId: DOSSIER_ID });
    ingest(d.records || []);
    save();
    renderAll();
    $('status').textContent = 'À jour';
  } catch (e) {
    $('status').textContent = S.recs.length ? 'Copie locale' : '';
    toast(`Mise à jour impossible : ${e.message}`, true);
    if (!S.recs.length) $('empty').textContent = 'La sélection ne se charge pas. Réessaie avec « Actualiser ».';
  } finally {
    $('btn-refresh').disabled = false;
    lastRefresh = Date.now();
  }
}

// ---------- Écritures ----------
async function patch(r, fields) {
  const before = {};
  for (const k in fields) before[k] = r.f[k];
  Object.assign(r.f, fields);
  try {
    await apiPost('updatePiece', { rowIndex: r.id, fields });
    save();
    return true;
  } catch (e) {
    Object.assign(r.f, before);
    toast(`Pas enregistré : ${e.message}`, true);
    return false;
  }
}

// ---------- Rendu ----------
function filtered() {
  const words = norm(S.q).trim().split(/\s+/).filter(Boolean);
  return S.recs.filter(r => {
    const f = r.f;
    if (S.fa && !favA(f)) return false;
    if (S.fp && !favP(f)) return false;
    if (S.cat && f.Category !== S.cat) return false;
    if (S.status && statusOf(f) !== S.status) return false;
    if (words.length) { const h = norm(`${f.Title} ${f.Brand} ${f.Size} ${f.Category} ${f.Subcategory}`); if (!words.every(w => h.includes(w))) return false; }
    return true;
  });
}

function priceSize(f) {
  const p = f.Price != null && f.Price !== '' ? `${f.Price}€` : '';
  return [p, f.Size || ''].filter(Boolean).join(' / ');
}

function cardHtml(r) {
  const f = r.f;
  const st = statusOf(f);
  const path = [f.Category, f.Subcategory, f['Sub-Subcategory']].filter(Boolean).join(' › ') || 'catégorie à choisir';
  const subs = f.Category ? subsOf(f.Category) : [];
  const subsubs = f.Category && f.Subcategory ? subsubsOf(f.Category, f.Subcategory) : [];
  const opt = (list, cur, ph) => `<option value="">${ph}</option>` + list.map(v => `<option ${v === cur ? 'selected' : ''}>${esc(v)}</option>`).join('');
  return `<article class="card" data-id="${r.id}">
    <div class="ph">
      <a href="${esc(f.Vinted_Link || '#')}" target="_blank" rel="noopener" aria-label="Voir l'annonce">${f.Images_Link ? `<img src="${esc(img(f.Images_Link, 500))}" alt="" loading="lazy" decoding="async" onerror="this.remove()">` : ''}</a>
      <div class="fav">
        <button class="favbtn a${favA(f) ? ' on' : ''}" data-act="fa" aria-pressed="${favA(f)}" title="Coup de cœur Adrien">A</button>
        <button class="favbtn p${favP(f) ? ' on' : ''}" data-act="fp" aria-pressed="${favP(f)}" title="Coup de cœur Pauline">P</button>
      </div>
      <button class="del" data-act="del" title="Supprimer">✕</button>
    </div>
    <div class="meta">
      <span class="b">${esc(f.Brand || '—')}</span>
      <span class="t">${esc(f.Title || f.find_id)}</span>
    </div>
    <input class="ps" data-act="ps" value="${esc(priceSize(f))}" placeholder="Prix / taille (ex. 8€ / S)" aria-label="Prix et taille">
    <div class="st">${STATUSES.map(s => `<button data-act="st" data-v="${esc(s.v)}" aria-pressed="${st === s.v}" style="color:${st === s.v ? s.c : ''}"><i style="background:${s.c}"></i>${esc(s.v)}</button>`).join('')}</div>
    <details class="cat"><summary>${esc(path)}</summary>
      <select data-act="c0">${opt(CATS, f.Category, 'Catégorie…')}</select>
      <select data-act="c1" ${subs.length ? '' : 'disabled'}>${opt(subs, f.Subcategory, 'Sous-catégorie…')}</select>
      ${subsubs.length ? `<select data-act="c2">${opt(subsubs, f['Sub-Subcategory'], 'Précision…')}</select>` : ''}
    </details>
  </article>`;
}

function renderGrid() {
  const list = filtered();
  $('grid').innerHTML = list.map(cardHtml).join('');
  $('empty').classList.toggle('hidden', !!list.length);
  if (!list.length) $('empty').textContent = S.recs.length ? 'Aucune pièce pour ces filtres.' : 'Aucune pièce dans ce dossier pour le moment.';
  $('count').textContent = `${list.length === S.recs.length ? '' : list.length + ' / '}${S.recs.length} pièces`;
}

function renderFilters() {
  $('n-a').textContent = S.recs.filter(r => favA(r.f)).length;
  $('n-p').textContent = S.recs.filter(r => favP(r.f)).length;
  $('f-a').setAttribute('aria-pressed', S.fa); $('f-p').setAttribute('aria-pressed', S.fp);
  const cats = CATS.filter(c => S.recs.some(r => r.f.Category === c));
  $('f-cat').innerHTML = `<option value="">Catégorie : toutes</option>` + cats.map(c => `<option ${c === S.cat ? 'selected' : ''}>${esc(c)}</option>`).join('');
  $('f-cat').classList.toggle('on', !!S.cat);
  $('f-status').innerHTML = `<button class="chip" data-v="" aria-pressed="${!S.status}">Tous les statuts<b>${S.recs.length}</b></button>` +
    STATUSES.map(s => `<button class="chip" data-v="${esc(s.v)}" aria-pressed="${S.status === s.v}"><i style="background:${s.c}"></i>${esc(s.v)}<b>${S.recs.filter(r => statusOf(r.f) === s.v).length}</b></button>`).join('');
}

function renderBudget() {
  const wait = S.recs.filter(r => statusOf(r.f) === "En attente d'achat");
  if (!wait.length) return $('budget').classList.add('hidden');
  const total = wait.reduce((s, r) => s + (parseFloat(r.f.Price) || 0), 0);
  $('budget').textContent = `${wait.length} pièce${wait.length > 1 ? 's' : ''} en attente d'achat · ${total.toFixed(2).replace('.', ',')} € au total`;
  $('budget').classList.remove('hidden');
}

function renderAll() { renderFilters(); renderBudget(); renderGrid(); }
const recOf = el => S.recs.find(r => String(r.id) === el.closest('.card').dataset.id);
function rerender(r) { const el = document.querySelector(`.card[data-id="${r.id}"]`); if (el) el.outerHTML = cardHtml(r); }

// ---------- Interactions ----------
$('grid').addEventListener('click', async e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.tagName === 'SELECT' || b.tagName === 'INPUT') return;
  const r = recOf(b);
  const act = b.dataset.act;
  if (act === 'fa' || act === 'fp') {
    const field = act === 'fa' ? 'Favorite A' : 'Favorite P';
    const next = !truthy(r.f[field]);
    b.disabled = true;
    if (await patch(r, { [field]: next ? 'true' : '' })) toast(next ? `Coup de cœur ${act === 'fa' ? 'Adrien' : 'Pauline'}` : 'Coup de cœur retiré');
    if ((S.fa || S.fp) && !next) renderGrid(); else rerender(r);
    renderFilters();
  }
  if (act === 'st') {
    if (await patch(r, { Status: b.dataset.v })) toast(b.dataset.v);
    renderBudget(); renderFilters();
    if (S.status && S.status !== b.dataset.v) renderGrid(); else rerender(r);
  }
  if (act === 'del') {
    if (!b.classList.contains('confirm')) {
      b.classList.add('confirm'); b.textContent = 'Supprimer ?';
      setTimeout(() => { if (b.isConnected) { b.classList.remove('confirm'); b.textContent = '✕'; } }, 4000);
      return;
    }
    b.disabled = true;
    try {
      await apiPost('deletePiece', { rowIndex: r.id });
      // Les lignes en dessous remontent d'un cran dans le Sheet : on suit, sinon les modifications
      // suivantes viseraient la mauvaise pièce (bug de l'ancienne version).
      S.recs = S.recs.filter(x => x !== r);
      S.recs.forEach(x => { if (x.id > r.id) x.id--; });
      save();
      const card = b.closest('.card'); card.classList.add('gone');
      setTimeout(() => { renderAll(); }, 250);
      toast('Pièce supprimée');
    } catch (err) {
      toast(`Suppression impossible : ${err.message}`, true);
      b.disabled = false;
    }
  }
});

$('grid').addEventListener('change', async e => {
  const el = e.target;
  if (!el.dataset.act || !el.dataset.act.startsWith('c')) return;
  const r = recOf(el);
  const v = el.value;
  const fields = el.dataset.act === 'c0' ? { Category: v, Subcategory: '', 'Sub-Subcategory': '' }
    : el.dataset.act === 'c1' ? { Subcategory: v, 'Sub-Subcategory': '' } : { 'Sub-Subcategory': v };
  el.disabled = true;
  if (await patch(r, fields)) toast('Catégorie mise à jour');
  rerender(r);
  document.querySelector(`.card[data-id="${r.id}"] details`)?.setAttribute('open', '');
  if (el.dataset.act === 'c0') renderFilters();
});

// Prix / taille : "8€ / S", "12", "M" … enregistré 700 ms après la dernière frappe.
const psTimers = new Map();
$('grid').addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.act !== 'ps') return;
  const r = recOf(el);
  clearTimeout(psTimers.get(r.id));
  psTimers.set(r.id, setTimeout(async () => {
    const raw = el.value.trim();
    const [a, b] = raw.split('/').map(s => s.trim());
    const m = (a || '').match(/[\d.,]+/);
    const price = m ? m[0].replace(',', '.') : '';
    const size = b || (m ? '' : a) || '';
    if (String(r.f.Price ?? '') === price && String(r.f.Size ?? '') === size) return;
    if (await patch(r, { Price: price, Size: size })) toast('Prix / taille enregistrés');
    renderBudget();
  }, 700));
});

$('f-a').addEventListener('click', () => { S.fa = !S.fa; renderFilters(); renderGrid(); });
$('f-p').addEventListener('click', () => { S.fp = !S.fp; renderFilters(); renderGrid(); });
$('f-cat').addEventListener('change', () => { S.cat = $('f-cat').value; renderFilters(); renderGrid(); });
$('f-status').addEventListener('click', e => { const c = e.target.closest('.chip'); if (!c) return; S.status = c.dataset.v; renderFilters(); renderGrid(); });
let qT; $('q').addEventListener('input', () => { clearTimeout(qT); qT = setTimeout(() => { S.q = $('q').value; renderGrid(); }, 150); });
$('btn-refresh').addEventListener('click', load);

const DENS = ['s', 'm', 'l'];
function applyDensity() {
  const d = prefs.density || 'm';
  document.body.classList.remove('dens-s', 'dens-l');
  if (d !== 'm') document.body.classList.add('dens-' + d);
  $('btn-density').textContent = 'Vignettes ' + d.toUpperCase();
}
$('btn-density').addEventListener('click', () => { prefs.density = DENS[(DENS.indexOf(prefs.density || 'm') + 1) % 3]; store.set('ap_prefs_v2', prefs); applyDensity(); });

// Récap des coups de cœur en attente d'achat, par personne, avec total.
function recapText() {
  const items = S.recs.filter(r => statusOf(r.f) === "En attente d'achat" && (favA(r.f) || favP(r.f)));
  const section = (label, fn) => {
    const list = items.filter(r => fn(r.f));
    if (!list.length) return null;
    let total = 0;
    const lines = [`★ Coups de cœur ${label} en attente d'achat`, ''];
    list.forEach(r => {
      const p = parseFloat(r.f.Price);
      if (!isNaN(p)) total += p;
      lines.push(`• ${r.f.Title || r.f.find_id} · ${!isNaN(p) ? p + '€' : 'prix ?'}${r.f.Size ? ' · taille ' + r.f.Size : ''}`);
      if (r.f.Vinted_Link) lines.push(`  ${r.f.Vinted_Link}`);
    });
    lines.push('', `Total ${label} : ${total.toFixed(2)}€`);
    return lines.join('\n');
  };
  const parts = [section('Adrien', favA), section('Pauline', favP)].filter(Boolean);
  return parts.length ? [`${DOSSIER_NAME}`, '', parts.join('\n\n')].join('\n') : null;
}
$('btn-recap').addEventListener('click', async () => {
  const t = recapText();
  if (!t) return toast("Aucun coup de cœur en attente d'achat pour le moment.");
  try { await navigator.clipboard.writeText(t); toast('Récap copié'); }
  catch (e) {
    const box = document.createElement('div');
    box.className = 'recapbox';
    box.innerHTML = `<div><span class="mono soft">Récap à copier</span><textarea readonly></textarea><button class="btn">Fermer</button></div>`;
    box.querySelector('textarea').value = t;
    document.body.appendChild(box);
    box.querySelector('textarea').select();
    box.addEventListener('click', ev => { if (ev.target === box || ev.target.tagName === 'BUTTON') box.remove(); });
  }
});

// Rafraîchit en revenant sur l'onglet (Pauline et Adrien modifient la même sélection).
let lastRefresh = 0;
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - lastRefresh > 20000) load(); });

document.title = `${DOSSIER_NAME} · Finds`;
$('title').firstChild.textContent = DOSSIER_NAME;
applyDensity();
const cached = store.get(CACHE_KEY, null);
if (Array.isArray(cached) && cached.length && cached[0].f) { S.recs = cached; renderAll(); $('status').textContent = 'Copie locale'; }
load();
</script>
