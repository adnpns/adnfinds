<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Finds</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap">
<style>
/* Archive de pièces, dans la direction artistique d'adrienpons.com :
   fond noir, serif pour les noms, chasse fixe pour les repères, un seul accent. */
:root {
  --void: #0c0b0a;
  --void-alt: #151312;
  --raise: #1c1a18;
  --ink: #e9e4d8;
  --ink-soft: #8c8577;
  --line: #2e2b26;
  --line-strong: #4a453c;
  --accent: #d97a4f;
  --ok: #8fb58a;
  --danger: #e0705f;
  --mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --gutter: clamp(14px, 3vw, 32px);
  --card-min: 170px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--void); color: var(--ink); }
body { font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; padding-bottom: env(safe-area-inset-bottom, 0px); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
.soft { color: var(--ink-soft); }
.hidden { display: none !important; }

/* ---------- En-tête ---------- */
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--void) 92%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); padding: calc(12px + env(safe-area-inset-top, 0px)) var(--gutter) 0; }
.row1 { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brand { font-family: var(--serif); font-size: 24px; letter-spacing: -.01em; margin: 0; }
.brand small { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; color: var(--ink-soft); margin-left: 8px; }
.search { flex: 1 1 260px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line-strong); padding: 6px 0; min-width: 0; }
.search input { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; font-family: var(--serif); font-size: 17px; }
.search input::placeholder { color: var(--ink-soft); }
.tools { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.btn { background: transparent; border: 1px solid var(--line-strong); padding: 7px 11px; font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink); white-space: nowrap; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--void); border-color: var(--ink); }
.btn.solid { background: var(--accent); border-color: var(--accent); color: var(--void); }
.btn.solid:hover { color: var(--void); filter: brightness(1.08); }
.btn:disabled { opacity: .4; cursor: default; }
.status { font-family: var(--mono); font-size: 11px; letter-spacing: .06em; color: var(--ink-soft); white-space: nowrap; }
.status.busy::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-right: 6px; animation: pulse 1s infinite alternate; }
@keyframes pulse { to { opacity: .2; } }

.row2 { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-top: 12px; }
.tabs { display: flex; gap: 18px; }
.tab { background: none; border: 0; padding: 6px 0; border-bottom: 1px solid transparent; font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab b { font-weight: 400; color: var(--star, var(--ink-soft)); margin-left: 4px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
.filters select { background: var(--void); border: 1px solid var(--line); padding: 6px 8px; font-family: var(--mono); font-size: 11px; letter-spacing: .04em; max-width: 190px; }
.filters select.on { border-color: var(--accent); color: var(--accent); }

.chips { display: flex; gap: 6px; overflow-x: auto; padding: 12px 0; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips.sub { padding-top: 0; }
.chip { flex: none; background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: 13px; color: var(--ink-soft); }
.chip b { font-family: var(--mono); font-weight: 400; font-size: 11px; margin-left: 6px; color: var(--ink-soft); }
.chip:hover { color: var(--ink); border-color: var(--line-strong); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--void); border-color: var(--ink); }
.chip[aria-pressed="true"] b { color: var(--void); }

/* ---------- Grille ---------- */
main { padding: 18px var(--gutter) 120px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--card-min), 1fr)); gap: 22px 14px; }
.card { position: relative; background: none; border: 0; padding: 0; text-align: left; display: grid; gap: 8px; align-content: start; min-width: 0; }
.ph { position: relative; aspect-ratio: 4 / 5; background: var(--void-alt); overflow: hidden; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .5s ease, opacity .3s; }
.card:hover .ph img { transform: scale(1.03); }
.ph .noimg { position: absolute; inset: 0; display: grid; place-items: center; }
.tick { position: absolute; top: 8px; left: 8px; width: 22px; height: 22px; border: 1px solid var(--ink); background: color-mix(in srgb, var(--void) 60%, transparent); display: none; place-items: center; font-size: 13px; line-height: 1; }
body.selecting .tick { display: grid; }
.card.sel .tick { background: var(--accent); border-color: var(--accent); color: var(--void); }
.card.sel .ph { outline: 2px solid var(--accent); outline-offset: -2px; }
.dots { position: absolute; right: 8px; bottom: 8px; display: flex; gap: 4px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 1px var(--void); }
.meta { display: grid; gap: 2px; min-width: 0; }
.meta .b { font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta .t { font-family: var(--serif); font-size: 15px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.meta .p { font-family: var(--mono); font-size: 10.5px; color: var(--ink-soft); letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta .p.todo { color: var(--accent); }
.dens-s { --card-min: 120px; }
.dens-s .meta .t, .dens-s .meta .p { display: none; }
.dens-l { --card-min: 260px; }

.empty, .loading { padding: 80px 0; text-align: center; color: var(--ink-soft); font-family: var(--serif); font-size: 20px; }
.loading .mono { display: block; margin-top: 10px; font-size: 11px; }
.more { grid-column: 1 / -1; height: 1px; }

/* ---------- Fiche (panneau) ---------- */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .2s; }
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; z-index: 41; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--void-alt); border-left: 1px solid var(--line); transform: translateX(100%); transition: transform .25s ease; display: flex; flex-direction: column; }
.sheet.open { transform: none; }
.sheet-head { display: flex; align-items: center; gap: 8px; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; border-bottom: 1px solid var(--line); }
.sheet-head .pos { margin-right: auto; }
.sheet-body { overflow-y: auto; padding: 0 0 calc(30px + env(safe-area-inset-bottom, 0px)); }
.hero { height: min(62vh, 680px); width: 100%; background: var(--void); display: grid; place-items: center; overflow: hidden; }
.hero img { width: 100%; height: 100%; object-fit: contain; display: block; }
.sect { padding: 18px 20px 0; display: grid; gap: 10px; }
.sect h2 { font-family: var(--serif); font-weight: 400; font-size: 26px; line-height: 1.15; margin: 0; overflow-wrap: anywhere; }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px 16px; border-top: 1px solid var(--line); padding-top: 12px; }
.facts div { display: grid; gap: 2px; min-width: 0; }
.facts span:last-child { overflow-wrap: anywhere; }
.label { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); display: flex; justify-content: space-between; gap: 10px; border-top: 1px solid var(--line); padding-top: 12px; }
.pick { display: flex; flex-wrap: wrap; gap: 6px; }
.pick .chip.saving { opacity: .5; }
.link-out { display: inline-flex; gap: 8px; align-items: center; font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); text-decoration: none; }
.danger { border-color: color-mix(in srgb, var(--danger) 60%, transparent); color: var(--danger); }
.danger.confirm { background: var(--danger); color: var(--void); }
@media (max-width: 640px) {
  .sheet { width: 100%; border-left: 0; }
  .hero { height: 52vh; }
}

/* ---------- Barre de sélection ---------- */
.bulk { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 140%); z-index: 30; background: var(--raise); border: 1px solid var(--line-strong); padding: 10px 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; width: min(760px, calc(100% - 24px)); transition: transform .2s ease; box-shadow: 0 20px 50px rgba(0,0,0,.6); }
.bulk.open { transform: translate(-50%, 0); }
.bulk .n { font-family: var(--serif); font-size: 18px; margin-right: auto; }
.bulk select { background: var(--void); border: 1px solid var(--line-strong); padding: 7px 8px; font-family: var(--mono); font-size: 11px; max-width: 180px; }

/* ---------- Petites fenêtres ---------- */
.pop { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: rgba(0,0,0,.6); padding: 16px; }
.pop form { background: var(--void-alt); border: 1px solid var(--line-strong); padding: 22px; width: min(420px, 100%); display: grid; gap: 14px; }
.pop h3 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: 22px; }
.pop input, .pop select { background: transparent; border: 0; border-bottom: 1px solid var(--line-strong); padding: 8px 0; font-family: var(--serif); font-size: 18px; }
.pop .acts { display: flex; gap: 8px; justify-content: flex-end; }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 30px); opacity: 0; z-index: 70; background: var(--ink); color: var(--void); padding: 9px 14px; font-family: var(--mono); font-size: 11px; letter-spacing: .06em; transition: opacity .2s, transform .2s; pointer-events: none; max-width: calc(100% - 24px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.err { background: var(--danger); }
body.bulk-open .toast { bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media (max-width: 640px) {
  :root { --card-min: 140px; }
  .dens-s { --card-min: 96px; }
  .dens-l { --card-min: 300px; }
  /* En-tête non collant sur téléphone : il prendrait la moitié de l'écran. */
  .top { position: static; }
  .row1 { gap: 10px; }
  .search { order: 3; flex-basis: 100%; }
  .tools { margin-left: auto; }
  .tools .status { display: none; }
  .row2 { gap: 10px; }
  .filters { margin-left: 0; flex-wrap: nowrap; overflow-x: auto; width: 100%; scrollbar-width: none; }
  .filters select { flex: none; }
  .grid { gap: 18px 10px; }
  .row1 .brand small { display: none; }
}
</style>
</head>
<body>

<header class="top">
  <div class="row1">
    <h1 class="brand">Finds<small id="total"></small></h1>
    <label class="search" for="q"><span class="mono soft">Chercher</span><input id="q" type="search" placeholder="titre, marque…" autocomplete="off"></label>
    <div class="tools">
      <span class="status" id="status">—</span>
      <button class="btn" id="btn-refresh" title="Recharger depuis le Sheet">Actualiser</button>
      <button class="btn" id="btn-select" aria-pressed="false">Sélection</button>
      <button class="btn" id="btn-density" title="Taille des vignettes">Vignettes M</button>
    </div>
  </div>
  <div class="row2">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="all" aria-selected="true">Tout<b id="n-all"></b></button>
      <button class="tab" role="tab" data-tab="nofolder" aria-selected="false">Sans dossier<b id="n-nofolder"></b></button>
      <button class="tab" role="tab" data-tab="nocat" aria-selected="false">À classer<b id="n-nocat"></b></button>
    </div>
    <div class="filters">
      <select id="f-folder" aria-label="Dossier"></select>
      <select id="f-account" aria-label="Compte Vinted"></select>
      <select id="f-era" aria-label="Époque" class="hidden"></select>
      <select id="f-universe" aria-label="Univers" class="hidden"></select>
      <button class="btn" id="btn-new-folder">+ Dossier</button>
    </div>
  </div>
  <div class="chips" id="chips-cat" aria-label="Catégories"></div>
  <div class="chips sub" id="chips-sub" aria-label="Sous-catégories"></div>
</header>

<main>
  <div class="loading" id="loading">Ouverture de l'archive…<span class="mono">première fois : jusqu'à 2 minutes, ensuite instantané</span></div>
  <div class="empty hidden" id="empty"></div>
  <div class="grid" id="grid"></div>
</main>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" aria-hidden="true" aria-label="Fiche pièce">
  <div class="sheet-head">
    <span class="pos mono soft" id="sheet-pos"></span>
    <button class="btn" id="sheet-prev" title="Pièce précédente (←)">←</button>
    <button class="btn" id="sheet-next" title="Pièce suivante (→)">→</button>
    <button class="btn" id="sheet-close" title="Fermer (Échap)">Fermer</button>
  </div>
  <div class="sheet-body" id="sheet-body"></div>
</aside>

<div class="bulk" id="bulk" aria-label="Actions sur la sélection">
  <span class="n" id="bulk-n">0 pièce</span>
  <select id="bulk-folder" aria-label="Ajouter au dossier"></select>
  <select id="bulk-cat" aria-label="Changer la catégorie"></select>
  <button class="btn" id="bulk-all">Tout sélectionner</button>
  <button class="btn" id="bulk-clear">Vider</button>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
const DEFAULT_API = 'https://script.google.com/macros/s/AKfycbypp-fgmCsLZAovVvFrhbDCRDBrqie6_o3Fm7MAFTmOVd9dGr7ic7jb_fk1A1K_NoXlOw/exec';
// Ancienne clé de configuration (version précédente du site) : on la relit si elle existe.
const LS_CONFIG = 'finds_tri_config';
const LS_PREFS = 'finds_prefs_v2';

// Arborescence : identique à vinted-to-finds-extension/categorizer.js (v2, 09/10/2026).
const CATEGORIE_MAP = {
  'Jackets': {
    'Blazers': [],
    'Bombers': [],
    'Varsity / Teddy': [],
    'Denim Jackets': [],
    'Leather jacket': ['Biker', 'Blouson', 'Coat'],
    'Track jackets': [],
    'Workwear': [],
    'Overcoats': [],
    'Puffers': [],
    'Vests': ['Down vest', 'Gilet']
  },
  'Tops': {
    'Tees': ['Graphic tee', 'Plain tee', 'Band / Movie tee'],
    'Shirts': ['Casual shirt', 'Dress shirt', 'Flannel', 'Western', 'Hawaiian'],
    'Polos': [],
    'Jerseys': ['Football', 'Basketball / NBA', 'Rugby', 'Other sport']
  },
  'Sweaters': {
    'Knits': ['Wool / Cashmere', 'Cardigan'],
    'Crewnecks': [],
    'Hoodies': [],
    'Zip Hoodies': [],
    'Fleece': []
  },
  'Bottoms': {
    '5 pockets pants': [],
    'Denim pants': [],
    'Dress pants': [],
    'Shorts': [],
    'Work pants': [],
    'Tracksuits': [],
    'Skirts': []
  },
  'Shoes': {
    'Dress shoes': [],
    'Boots': [],
    'Sandals': [],
    'Sneakers': []
  },
  'Accessories': {
    'Bags': ['Backpack', 'Crossbody', 'Shoulder bag', 'Tote'],
    'Hats': ['Beanie', 'Bucket hat', 'Cap'],
    'Jewellery': ['Bracelet', 'Charm', 'Keychain', 'Necklace', 'Ring', 'Watch'],
    'Belts': ['Chain belt', 'Leather belt', 'Western buckle'],
    'Scarfs': [],
    'Sunglasses': [],
    'Gloves': [],
    'Umbrellas': []
  },
  'Home': {
    'Furniture': [],
    'Décoration': [],
    'Textile': [],
    'Games': [],
    'Tableware': []
  },
  'Collectibles': {
    'Pins': [],
    'Cards / Pokémon': [],
    'Football memorabilia': []
  },
  'Sport': {
    'Autre': []
  },
  'Other': {
    'Autre': []
  }
};
const CATS = Object.keys(CATEGORIE_MAP);
const subsOf = c => Object.keys(CATEGORIE_MAP[c] || {});
const subsubsOf = (c, s) => (CATEGORIE_MAP[c] || {})[s] || [];
function isCategorized(f) {
  if (!f.Category || !f.Subcategory) return false;
  return !(subsubsOf(f.Category, f.Subcategory).length && !f['Sub-Subcategory']);
}

// ---------- État ----------
const prefs = (() => { try { return JSON.parse(localStorage.getItem(LS_PREFS)) || {}; } catch (e) { return {}; } })();
const savePrefs = () => { try { localStorage.setItem(LS_PREFS, JSON.stringify(prefs)); } catch (e) {} };
const apiUrl = (() => { try { return (JSON.parse(localStorage.getItem(LS_CONFIG)) || {}).apiUrl || DEFAULT_API; } catch (e) { return DEFAULT_API; } })();

const S = {
  pieces: [],          // { row, f } ; row = numéro de ligne dans le Sheet
  folders: [],         // { id, name, type }
  hasEra: false, hasUniverse: false,
  tab: prefs.tab || 'all', q: '', cat: '', sub: '', folder: '', account: '', era: '', universe: '',
  view: [], shown: 0,
  selecting: false, selected: new Set(),
  open: -1,            // index dans S.view de la fiche ouverte
};
const PAGE = 72;

// ---------- Petits utilitaires ----------
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const folderIds = f => String(f.Folders || '').split(',').map(s => s.trim()).filter(Boolean);
let toastTimer;
function toast(msg, err) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.toggle('err', !!err);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), err ? 5000 : 2200);
}
function setStatus(text, busy) {
  $('status').textContent = text;
  $('status').classList.toggle('busy', !!busy);
}
// Vignettes Drive légères pour la grille, grande taille pour la fiche.
function img(url, size) {
  const m = String(url || '').match(/[?&]id=([\w-]+)/) || String(url || '').match(/\/d\/([\w-]+)/);
  if (m && /drive\.google/.test(url)) return `https://drive.google.com/thumbnail?id=${m[1]}&sz=w${size}`;
  return url || '';
}

// ---------- API (Apps Script, appelé en anonyme) ----------
async function apiGet(action) {
  const delays = [4000, 12000];
  for (let i = 0; ; i++) {
    try {
      const res = await fetch(`${apiUrl}?action=${action}`, { credentials: 'omit' });
      if (!res.ok) throw new Error(`erreur ${res.status}`);
      const data = JSON.parse(await res.text());
      if (data.error) throw new Error(data.error);
      return data;
    } catch (e) {
      // Google répond parfois 404 quand la lecture des ~10 000 lignes est trop longue : on retente.
      if (i >= delays.length) throw new Error(`Lecture du Sheet impossible (${e.message}). Réessaie dans quelques minutes.`);
      await new Promise(r => setTimeout(r, delays[i]));
    }
  }
}
// Pas de nouvel essai sur une écriture : elle a pu passer malgré l'erreur.
async function apiPost(action, body) {
  const res = await fetch(apiUrl, { method: 'POST', credentials: 'omit', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, ...body }) });
  if (!res.ok) throw new Error(`erreur ${res.status}`);
  const data = JSON.parse(await res.text());
  if (data.error) throw new Error(data.error);
  return data;
}

// ---------- Cache local (IndexedDB : ~6 Mo, trop gros pour localStorage) ----------
const idb = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((resolve, reject) => {
      const req = indexedDB.open('finds', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('kv');
      req.onsuccess = () => resolve(this.db = req.result);
      req.onerror = () => reject(req.error);
    });
  },
  async get(k) {
    try {
      const db = await this.open();
      return await new Promise(r => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => r(q.result); q.onerror = () => r(null); });
    } catch (e) { return null; }
  },
  async set(k, v) {
    try {
      const db = await this.open();
      db.transaction('kv', 'readwrite').objectStore('kv').put(v, k);
    } catch (e) {}
  },
};
function persist() { idb.set('snapshot', { at: Date.now(), pieces: S.pieces, folders: S.folders }); }

function ingest(rawPieces, rawFolders) {
  S.pieces = rawPieces.map(r => ({ row: r.rowIndex, f: r.fields }));
  S.pieces.sort((a, b) => b.row - a.row); // dernières ajoutées en premier
  S.folders = rawFolders.map(r => ({ id: r.fields.id, name: r.fields.Name || 'Sans nom', type: r.fields.Type || '' }))
    .sort((a, b) => a.name.localeCompare(b.name));
  const cols = new Set(Object.keys(S.pieces[0]?.f || {}));
  S.hasEra = cols.has('Era');
  S.hasUniverse = cols.has('Universe');
}

function ago(ts) {
  const m = Math.round((Date.now() - ts) / 60000);
  if (m < 1) return "à l'instant";
  if (m < 60) return `il y a ${m} min`;
  const h = Math.round(m / 60);
  return h < 24 ? `il y a ${h} h` : `il y a ${Math.round(h / 24)} j`;
}

let refreshing = false;
async function refresh() {
  if (refreshing) return;
  refreshing = true;
  $('btn-refresh').disabled = true;
  setStatus('Lecture du Sheet…', true);
  try {
    const [p, d] = await Promise.all([apiGet('listPieces'), apiGet('listDossiers')]);
    const keepOpen = S.open >= 0 ? S.view[S.open]?.f.find_id : null;
    ingest(p.records || [], d.records || []);
    persist();
    renderAll();
    if (keepOpen) { const i = S.view.findIndex(x => x.f.find_id === keepOpen); if (i >= 0) openSheet(i); else closeSheet(); }
    setStatus('À jour ' + ago(Date.now()));
    prefs.lastSync = Date.now(); savePrefs();
  } catch (e) {
    setStatus(S.pieces.length ? 'Copie locale ' + ago(prefs.lastSync || Date.now()) : 'Hors ligne');
    toast(e.message, true);
    if (!S.pieces.length) { $('loading').classList.add('hidden'); showEmpty("Impossible d'ouvrir l'archive pour l'instant. Réessaie avec « Actualiser »."); }
  } finally {
    refreshing = false;
    $('btn-refresh').disabled = false;
  }
}

// ---------- Filtres ----------
function baseFiltered(skip) {
  const q = norm(S.q).trim();
  const words = q ? q.split(/\s+/) : [];
  return S.pieces.filter(p => {
    const f = p.f;
    if (S.tab === 'nofolder' && folderIds(f).length) return false;
    if (S.tab === 'nocat' && isCategorized(f)) return false;
    if (S.folder && !folderIds(f).includes(S.folder)) return false;
    if (S.account && String(f.Vinted_Account || '') !== S.account) return false;
    if (S.era && String(f.Era || '') !== S.era) return false;
    if (S.universe && !String(f.Universe || '').split(',').map(s => s.trim()).includes(S.universe)) return false;
    if (skip !== 'cat' && S.cat && f.Category !== S.cat) return false;
    if (skip !== 'cat' && skip !== 'sub' && S.sub && f.Subcategory !== S.sub) return false;
    if (words.length) {
      const hay = norm(`${f.Title} ${f.Brand} ${f.Category} ${f.Subcategory} ${f['Sub-Subcategory']} ${f.Size} ${f.Universe || ''} ${f.Era || ''}`);
      if (!words.every(w => hay.includes(w))) return false;
    }
    return true;
  });
}

function countBy(list, key) {
  const m = new Map();
  for (const p of list) { const k = p.f[key] || ''; m.set(k, (m.get(k) || 0) + 1); }
  return m;
}

function renderChips() {
  const forCats = baseFiltered('cat');
  const byCat = countBy(forCats, 'Category');
  const cats = CATS.filter(c => byCat.get(c));
  const none = byCat.get('') || 0;
  $('chips-cat').innerHTML =
    `<button class="chip" data-cat="" aria-pressed="${!S.cat}">Toutes<b>${forCats.length}</b></button>` +
    cats.map(c => `<button class="chip" data-cat="${esc(c)}" aria-pressed="${S.cat === c}">${esc(c)}<b>${byCat.get(c)}</b></button>`).join('') +
    (none ? `<button class="chip" data-cat="__none" aria-pressed="${S.cat === '__none'}">Sans catégorie<b>${none}</b></button>` : '');

  if (S.cat && S.cat !== '__none') {
    const bySub = countBy(baseFiltered('sub'), 'Subcategory');
    const subs = subsOf(S.cat).filter(s => bySub.get(s));
    const noSub = bySub.get('') || 0;
    $('chips-sub').innerHTML = subs.map(s => `<button class="chip" data-sub="${esc(s)}" aria-pressed="${S.sub === s}">${esc(s)}<b>${bySub.get(s)}</b></button>`).join('') +
      (noSub ? `<button class="chip" data-sub="__none" aria-pressed="${S.sub === '__none'}">À préciser<b>${noSub}</b></button>` : '');
    $('chips-sub').classList.remove('hidden');
  } else {
    $('chips-sub').innerHTML = '';
    $('chips-sub').classList.add('hidden');
  }
}

function renderSelects() {
  const opt = (v, label, cur) => `<option value="${esc(v)}" ${v === cur ? 'selected' : ''}>${esc(label)}</option>`;
  const count = key => countBy(S.pieces, key);
  $('f-folder').innerHTML = opt('', 'Dossier : tous', S.folder) + S.folders.map(d => opt(d.id, `${d.name} · ${S.pieces.filter(p => folderIds(p.f).includes(d.id)).length}`, S.folder)).join('');
  const acc = [...count('Vinted_Account').keys()].filter(Boolean).sort();
  $('f-account').innerHTML = opt('', 'Compte : tous', S.account) + acc.map(a => opt(a, a, S.account)).join('');
  if (S.hasEra) {
    const eras = [...count('Era').keys()].filter(Boolean).sort();
    $('f-era').innerHTML = opt('', 'Époque : toutes', S.era) + eras.map(e => opt(e, e, S.era)).join('');
    $('f-era').classList.remove('hidden');
  }
  if (S.hasUniverse) {
    const u = new Set();
    S.pieces.forEach(p => String(p.f.Universe || '').split(',').map(s => s.trim()).filter(Boolean).forEach(x => u.add(x)));
    $('f-universe').innerHTML = opt('', 'Univers : tous', S.universe) + [...u].sort().map(x => opt(x, x, S.universe)).join('');
    $('f-universe').classList.remove('hidden');
  }
  ['f-folder', 'f-account', 'f-era', 'f-universe'].forEach(id => $(id).classList.toggle('on', !!$(id).value));

  const folderOpts = S.folders.map(d => opt(d.id, d.name, '')).join('');
  $('bulk-folder').innerHTML = opt('', 'Ajouter au dossier…', '') + folderOpts + opt('__remove', '— Retirer du dossier filtré', '');
  $('bulk-cat').innerHTML = opt('', 'Changer la catégorie…', '') + CATS.map(c =>
    `<optgroup label="${esc(c)}">${subsOf(c).map(s => opt(`${c}|${s}`, `${c} › ${s}`, '')).join('')}</optgroup>`).join('');
}

function renderCounts() {
  const all = S.pieces.length;
  $('total').textContent = `${all.toLocaleString('fr-FR')} pièces`;
  $('n-all').textContent = all;
  $('n-nofolder').textContent = S.pieces.filter(p => !folderIds(p.f).length).length;
  $('n-nocat').textContent = S.pieces.filter(p => !isCategorized(p.f)).length;
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.tab === S.tab)));
}

// ---------- Grille ----------
function pathText(f) {
  if (!f.Category) return { t: 'à classer', todo: true };
  const parts = [f.Category, f.Subcategory, f['Sub-Subcategory']].filter(Boolean);
  return { t: parts.join(' › '), todo: !isCategorized(f) };
}

function cardHtml(p, i) {
  const f = p.f;
  const pt = pathText(f);
  const folders = folderIds(f);
  return `<button class="card${S.selected.has(p.f.find_id) ? ' sel' : ''}" data-i="${i}" type="button">
    <div class="ph">
      ${f.Images_Link ? `<img src="${esc(img(f.Images_Link, 400))}" alt="" loading="lazy" decoding="async" onerror="this.remove()">` : ''}
      <span class="noimg mono soft">${f.Images_Link ? '' : 'sans photo'}</span>
      <span class="tick">${S.selected.has(p.f.find_id) ? '✓' : ''}</span>
      ${folders.length ? `<span class="dots" title="${folders.length} dossier(s)">${folders.map(() => '<i></i>').join('')}</span>` : ''}
    </div>
    <div class="meta">
      <span class="b">${esc(f.Brand || '—')}</span>
      <span class="t">${esc(f.Title || f.find_id)}</span>
      <span class="p${pt.todo ? ' todo' : ''}">${esc(pt.t)}</span>
    </div>
  </button>`;
}

let moreObserver;
function renderGrid() {
  let list = baseFiltered();
  if (S.cat === '__none') list = baseFiltered('cat').filter(p => !p.f.Category);
  if (S.sub === '__none') list = list.filter(p => !p.f.Subcategory);
  S.view = list;
  S.shown = 0;
  $('grid').innerHTML = '';
  $('loading').classList.add('hidden');
  if (!list.length) {
    showEmpty(S.pieces.length ? 'Aucune pièce pour ces filtres.' : 'Archive vide.');
  } else {
    $('empty').classList.add('hidden');
    renderMore();
  }
}
function showEmpty(t) { $('empty').textContent = t; $('empty').classList.remove('hidden'); }

function renderMore() {
  const next = S.view.slice(S.shown, S.shown + PAGE);
  if (!next.length) return;
  document.querySelector('.more')?.remove();
  $('grid').insertAdjacentHTML('beforeend', next.map((p, k) => cardHtml(p, S.shown + k)).join(''));
  S.shown += next.length;
  if (S.shown < S.view.length) {
    const s = document.createElement('div');
    s.className = 'more';
    $('grid').appendChild(s);
    moreObserver ||= new IntersectionObserver(e => { if (e[0].isIntersecting) renderMore(); }, { rootMargin: '900px' });
    moreObserver.disconnect();
    moreObserver.observe(s);
  }
}

function rerenderCard(i) {
  const el = document.querySelector(`.card[data-i="${i}"]`);
  if (el && S.view[i]) el.outerHTML = cardHtml(S.view[i], i);
}

function renderAll() {
  renderCounts();
  renderSelects();
  renderChips();
  renderGrid();
}

// ---------- Écritures ----------
// Tous les champs d'une pièce en une seule écriture.
async function patch(p, fields) {
  const before = {};
  for (const k in fields) before[k] = p.f[k];
  Object.assign(p.f, fields); // affichage immédiat, annulé si l'écriture échoue
  try {
    await apiPost('updatePiece', { rowIndex: p.row, fields });
    persist();
    return true;
  } catch (e) {
    Object.assign(p.f, before);
    toast(`Pas enregistré : ${e.message}`, true);
    return false;
  }
}

async function removePiece(p) {
  await apiPost('deletePiece', { rowIndex: p.row });
  // Les lignes en dessous remontent d'un cran dans le Sheet : on suit, sinon les modifications
  // suivantes viseraient la mauvaise pièce (bug de l'ancienne version).
  S.pieces = S.pieces.filter(x => x !== p);
  S.pieces.forEach(x => { if (x.row > p.row) x.row--; });
  persist();
}

// ---------- Fiche ----------
function openSheet(i) {
  if (i < 0 || i >= S.view.length) return;
  S.open = i;
  while (i >= S.shown && S.shown < S.view.length) renderMore();
  renderSheet();
  $('sheet').classList.add('open');
  $('scrim').classList.add('open');
  $('sheet').setAttribute('aria-hidden', 'false');
  document.querySelector(`.card[data-i="${i}"]`)?.scrollIntoView({ block: 'nearest' });
}
function closeSheet() {
  S.open = -1;
  $('sheet').classList.remove('open');
  $('scrim').classList.remove('open');
  $('sheet').setAttribute('aria-hidden', 'true');
}

function factsHtml(f) {
  const facts = [
    ['Prix', f.Price ? `${f.Price} €` : ''], ['Taille', f.Size], ['État', f.Condition], ['Compte', f.Vinted_Account],
    ["J'aime", f.Likes], ['Époque', f.Era], ['Univers', f.Universe], ['Lien vérifié', f.Link_Checked_At ? String(f.Link_Checked_At).slice(0, 10) : ''],
  ].filter(([, v]) => v !== undefined && v !== null && String(v).trim() !== '');
  return facts.map(([k, v]) => `<div><span class="mono soft">${k}</span><span>${esc(v)}</span></div>`).join('');
}

function renderSheet() {
  const p = S.view[S.open];
  if (!p) return closeSheet();
  const f = p.f;
  const folders = folderIds(f);
  const subs = f.Category ? subsOf(f.Category) : [];
  const subsubs = f.Category && f.Subcategory ? subsubsOf(f.Category, f.Subcategory) : [];
  $('sheet-pos').textContent = `${S.open + 1} / ${S.view.length} · ligne ${p.row}`;
  $('sheet-body').innerHTML = `
    <div class="hero">${f.Images_Link ? `<img src="${esc(img(f.Images_Link, 1200))}" alt="${esc(f.Title)}">` : '<span class="mono soft">sans photo</span>'}</div>
    <div class="sect">
      <span class="mono soft">${esc(f.Brand || '—')}</span>
      <h2>${esc(f.Title || f.find_id)}</h2>
      ${f.Vinted_Link ? `<a class="link-out" href="${esc(f.Vinted_Link)}" target="_blank" rel="noopener">Voir sur Vinted ↗</a>` : ''}
      ${factsHtml(f) ? `<div class="facts">${factsHtml(f)}</div>` : ''}
    </div>
    <div class="sect">
      <div class="label"><span>Catégorie</span><span>${isCategorized(f) ? 'classée' : 'à compléter'}</span></div>
      <div class="pick" data-level="0">${CATS.map(c => `<button class="chip" data-v="${esc(c)}" aria-pressed="${f.Category === c}">${esc(c)}</button>`).join('')}</div>
      ${subs.length ? `<div class="pick" data-level="1">${subs.map(s => `<button class="chip" data-v="${esc(s)}" aria-pressed="${f.Subcategory === s}">${esc(s)}</button>`).join('')}</div>` : ''}
      ${subsubs.length ? `<div class="pick" data-level="2">${subsubs.map(s => `<button class="chip" data-v="${esc(s)}" aria-pressed="${f['Sub-Subcategory'] === s}">${esc(s)}</button>`).join('')}</div>` : ''}
    </div>
    <div class="sect">
      <div class="label"><span>Dossiers</span><span>${folders.length || 'aucun'}</span></div>
      <div class="pick" data-folders>${S.folders.map(d => `<button class="chip" data-folder="${esc(d.id)}" aria-pressed="${folders.includes(d.id)}" title="${esc(d.type)}">${esc(d.name)}</button>`).join('')}</div>
    </div>
    <div class="sect">
      <div class="label"><span>Pièce</span><span>${esc(f.find_id)}</span></div>
      <div><button class="btn danger" id="btn-delete">Supprimer de Finds</button></div>
    </div>`;
}

async function onSheetClick(e) {
  const p = S.view[S.open];
  if (!p) return;
  const chip = e.target.closest('.pick .chip');
  if (chip && chip.closest('[data-level]')) {
    const level = Number(chip.closest('[data-level]').dataset.level);
    const v = chip.dataset.v;
    const f = p.f;
    let fields;
    if (level === 0) fields = { Category: v, Subcategory: '', 'Sub-Subcategory': '' };
    if (level === 1) fields = { Subcategory: v, 'Sub-Subcategory': '' };
    if (level === 2) fields = { 'Sub-Subcategory': v };
    if (level === 0 && f.Category === v) return;
    chip.classList.add('saving');
    const ok = await patch(p, fields);
    if (ok) {
      renderSheet(); rerenderCard(S.open); renderCounts(); renderChips();
      // Classement terminé dans l'onglet "À classer" : on passe directement à la suivante.
      if (S.tab === 'nocat' && isCategorized(p.f)) toast('Classée');
    } else renderSheet();
    return;
  }
  if (chip && chip.dataset.folder) {
    const id = chip.dataset.folder;
    const cur = folderIds(p.f);
    const next = cur.includes(id) ? cur.filter(x => x !== id) : [...cur, id];
    chip.classList.add('saving');
    const ok = await patch(p, { Folders: next.join(',') });
    const name = S.folders.find(d => d.id === id)?.name || '';
    if (ok) toast(cur.includes(id) ? `Retirée de ${name}` : `Ajoutée à ${name}`);
    renderSheet(); rerenderCard(S.open); renderCounts(); renderSelects();
    return;
  }
  if (e.target.id === 'btn-delete') {
    const b = e.target;
    if (!b.classList.contains('confirm')) {
      b.classList.add('confirm');
      b.textContent = 'Confirmer la suppression';
      setTimeout(() => { if (b.isConnected) { b.classList.remove('confirm'); b.textContent = 'Supprimer de Finds'; } }, 4000);
      return;
    }
    b.disabled = true;
    b.textContent = 'Suppression…';
    try {
      const idx = S.open;
      await removePiece(p);
      toast('Pièce supprimée');
      S.view.splice(idx, 1);
      renderCounts(); renderChips();
      document.querySelector(`.card[data-i="${idx}"]`)?.remove();
      // Réindexe les cartes affichées après la suppression
      document.querySelectorAll('.card').forEach(c => { const n = Number(c.dataset.i); if (n > idx) c.dataset.i = n - 1; });
      S.shown = Math.max(0, S.shown - 1);
      if (S.view.length) openSheet(Math.min(idx, S.view.length - 1)); else closeSheet();
    } catch (err) {
      toast(`Suppression impossible : ${err.message}`, true);
      renderSheet();
    }
  }
}

// ---------- Sélection multiple ----------
function setSelecting(on) {
  S.selecting = on;
  document.body.classList.toggle('selecting', on);
  $('btn-select').setAttribute('aria-pressed', String(on));
  if (!on) S.selected.clear();
  renderBulk();
  document.querySelectorAll('.card').forEach(c => rerenderCard(Number(c.dataset.i)));
}
function renderBulk() {
  const n = S.selected.size;
  $('bulk-n').textContent = `${n} pièce${n > 1 ? 's' : ''}`;
  const open = S.selecting;
  $('bulk').classList.toggle('open', open);
  document.body.classList.toggle('bulk-open', open);
  $('bulk-folder').disabled = $('bulk-cat').disabled = !n;
}
let lastClicked = -1;
function toggleSelect(i, range) {
  const ids = [];
  if (range && lastClicked >= 0) {
    const [a, b] = [Math.min(lastClicked, i), Math.max(lastClicked, i)];
    for (let k = a; k <= b; k++) ids.push(k);
  } else ids.push(i);
  const target = !S.selected.has(S.view[i].f.find_id);
  ids.forEach(k => { const id = S.view[k].f.find_id; target ? S.selected.add(id) : S.selected.delete(id); rerenderCard(k); });
  lastClicked = i;
  renderBulk();
}

async function bulkApply(makeFields, label) {
  const items = S.pieces.filter(p => S.selected.has(p.f.find_id));
  let done = 0, failed = 0;
  setStatus(`${label} 0 / ${items.length}`, true);
  for (const p of items) {
    const fields = makeFields(p);
    if (!fields) { done++; continue; }
    (await patch(p, fields)) ? done++ : failed++;
    setStatus(`${label} ${done + failed} / ${items.length}`, true);
  }
  setStatus('À jour ' + ago(Date.now()));
  toast(failed ? `${done} faites, ${failed} en échec` : `${done} pièce${done > 1 ? 's' : ''} mise${done > 1 ? 's' : ''} à jour`, !!failed);
  renderAll();
}

// ---------- Nouveau dossier ----------
function newFolderDialog() {
  const wrap = document.createElement('div');
  wrap.className = 'pop';
  wrap.innerHTML = `<form>
    <h3>Nouveau dossier</h3>
    <input id="nf-name" placeholder="Nom (ex. Mehdi, Vestiaire…)" required autocomplete="off">
    <select id="nf-type"><option>Client</option><option>Public</option><option>Collection</option><option>Autre</option></select>
    <div class="acts"><button type="button" class="btn" data-cancel>Annuler</button><button class="btn solid">Créer</button></div>
  </form>`;
  document.body.appendChild(wrap);
  wrap.querySelector('#nf-name').focus();
  wrap.addEventListener('click', e => { if (e.target === wrap || e.target.dataset.cancel !== undefined) wrap.remove(); });
  wrap.querySelector('form').addEventListener('submit', async e => {
    e.preventDefault();
    const name = wrap.querySelector('#nf-name').value.trim();
    const type = wrap.querySelector('#nf-type').value;
    if (!name) return;
    e.submitter && (e.submitter.disabled = true);
    try {
      await apiPost('createDossier', { name, type });
      const d = await apiGet('listDossiers');
      S.folders = (d.records || []).map(r => ({ id: r.fields.id, name: r.fields.Name || 'Sans nom', type: r.fields.Type || '' })).sort((a, b) => a.name.localeCompare(b.name));
      persist();
      renderSelects();
      if (S.open >= 0) renderSheet();
      toast(`Dossier ${name} créé`);
      wrap.remove();
    } catch (err) {
      toast(`Création impossible : ${err.message}`, true);
      e.submitter && (e.submitter.disabled = false);
    }
  });
}

});
$('btn-refresh').addEventListener('click', refresh);
$('btn-select').addEventListener('click', () => setSelecting(!S.selecting));
$('btn-density').addEventListener('click', () => {
  prefs.density = DENS[(DENS.indexOf(prefs.density || 'm') + 1) % 3]; savePrefs(); applyDensity();
});
$('btn-new-folder').addEventListener('click', newFolderDialog);
$('bulk-clear').addEventListener('click', () => { S.selected.clear(); renderBulk(); document.querySelectorAll('.card.sel').forEach(c => rerenderCard(Number(c.dataset.i))); });
$('bulk-all').addEventListener('click', () => { S.view.forEach(p => S.selected.add(p.f.find_id)); renderBulk(); document.querySelectorAll('.card').forEach(c => rerenderCard(Number(c.dataset.i))); });
$('bulk-folder').addEventListener('change', async () => {
  const v = $('bulk-folder').value; $('bulk-folder').value = '';
  if (!v) return;
  if (v === '__remove') {
    if (!S.folder) { toast('Filtre d\'abord sur un dossier pour en retirer des pièces', true); return; }
    const name = S.folders.find(d => d.id === S.folder)?.name;
    await bulkApply(p => folderIds(p.f).includes(S.folder) ? { Folders: folderIds(p.f).filter(x => x !== S.folder).join(',') } : null, `Retrait de ${name}`);
    return;
  }
  const name = S.folders.find(d => d.id === v)?.name;
  await bulkApply(p => folderIds(p.f).includes(v) ? null : { Folders: [...folderIds(p.f), v].join(',') }, `Ajout à ${name}`);
});
$('bulk-cat').addEventListener('change', async () => {
  const v = $('bulk-cat').value; $('bulk-cat').value = '';
  if (!v) return;
  const [c, s] = v.split('|');
  await bulkApply(() => ({ Category: c, Subcategory: s, 'Sub-Subcategory': '' }), `${c} › ${s}`);
});

// ---------- Démarrage : copie locale tout de suite, puis lecture fraîche ----------
(async () => {
  applyDensity();
  // Si la copie locale tarde (navigation privée, stockage bloqué), on n'attend pas plus de 2 s.
  const snap = await Promise.race([idb.get('snapshot'), new Promise(r => setTimeout(() => r(null), 2000))]);
  if (snap && snap.pieces && snap.pieces.length) {
    S.pieces = snap.pieces;
    S.folders = snap.folders || [];
    const cols = new Set(Object.keys(S.pieces[0]?.f || {}));
    S.hasEra = cols.has('Era'); S.hasUniverse = cols.has('Universe');
    renderAll();
    setStatus('Copie locale ' + ago(snap.at));
  }
  refresh();
})();
</script>
</body>
