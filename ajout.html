<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ajouter · Finds</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0c0b0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap">
<style>
/* Ajout rapide d'une pièce depuis un lien Vinted, pensé pour le téléphone.
   Même direction artistique que Finds et adrienpons.com. */
:root {
  --void: #0c0b0a;
  --void-alt: #151312;
  --ink: #e9e4d8;
  --ink-soft: #8c8577;
  --line: #2e2b26;
  --line-strong: #4a453c;
  --accent: #d97a4f;
  --ok: #8fb58a;
  --danger: #e0705f;
  --mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--void); color: var(--ink); }
body { font: 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 1px solid var(--accent); outline-offset: 3px; }
.mono { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
.soft { color: var(--ink-soft); }

main { max-width: 560px; margin: 0 auto; padding: calc(40px + env(safe-area-inset-top, 0px)) 18px calc(48px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 28px; }
h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(34px, 9vw, 52px); line-height: 1.02; margin: 10px 0 0; }
.lede { color: var(--ink-soft); margin: 10px 0 0; }

.form { display: grid; gap: 14px; }
label { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
.field { display: flex; gap: 8px; align-items: center; border-bottom: 1px solid var(--line-strong); }
.field:focus-within { border-bottom-color: var(--accent); }
.field input, .field select { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; padding: 10px 0; font-family: var(--serif); font-size: 18px; }
.field select option { background: var(--void); }
.btn { background: transparent; border: 1px solid var(--line-strong); padding: 10px 14px; font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink); cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.big { width: 100%; padding: 16px; background: var(--accent); border-color: var(--accent); color: var(--void); font-size: 12px; }
.btn.big:hover { color: var(--void); filter: brightness(1.08); }
.btn:disabled { opacity: .45; cursor: default; }

.status { min-height: 1.5em; font-family: var(--mono); font-size: 12px; letter-spacing: .04em; }
.status.ok { color: var(--ok); }
.status.error { color: var(--danger); }
.status.loading { color: var(--ink-soft); }

.added { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 14px; align-items: center; border-top: 1px solid var(--line); padding-top: 16px; }
.added img { width: 96px; aspect-ratio: 4 / 5; object-fit: cover; background: var(--void-alt); display: block; }
.added .t { font-family: var(--serif); font-size: 19px; line-height: 1.2; overflow-wrap: anywhere; }

.recent h2 { margin: 0 0 10px; }
.recent ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.recent li { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.recent li img, .recent li .ph { width: 44px; aspect-ratio: 4 / 5; object-fit: cover; background: var(--void-alt); display: block; }
.recent li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--serif); }
.recent li small { font-family: var(--mono); font-size: 10.5px; color: var(--ink-soft); }
.foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.foot a { color: var(--ink-soft); }
</style>
</head>
<body>
<main>
  <header>
    <span class="mono soft">Finds · ajout rapide</span>
    <h1>Ajouter une pièce</h1>
    <p class="lede">Colle le lien d'une annonce Vinted : la pièce est ajoutée à Finds, directement dans le dossier choisi.</p>
  </header>

  <form class="form" id="form">
    <label for="link">Lien Vinted</label>
    <div class="field">
      <input type="url" id="link" inputmode="url" placeholder="https://www.vinted.fr/items/…" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      <button class="btn" type="button" id="paste">Coller</button>
    </div>
    <label for="folder">Dossier</label>
    <div class="field">
      <select id="folder"><option value="A+P">A+P</option></select>
    </div>
    <button class="btn big" type="submit" id="add">Ajouter à A+P</button>
    <div class="status" id="status" role="status"></div>
    <div id="added"></div>
  </form>

  <section class="recent" id="recent" hidden>
    <h2 class="mono soft">Dernières pièces ajoutées sur ce téléphone</h2>
    <ul id="recent-list"></ul>
  </section>

  <footer class="foot mono">
    <a href="./">Ouvrir Finds</a>
    <a href="./ap.html">Sélection A+P</a>
  </footer>
</main>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbypp-fgmCsLZAovVvFrhbDCRDBrqie6_o3Fm7MAFTmOVd9dGr7ic7jb_fk1A1K_NoXlOw/exec';
const RECENT_KEY = 'ap_recent_added';
const FOLDER_KEY = 'ajout_folder';
// ?dossier=Vestiaire dans l'adresse choisit le dossier par défaut (sinon A+P, ou le dernier utilisé).
const params = new URLSearchParams(location.search);

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};

function status(msg, type) { $('status').textContent = msg; $('status').className = 'status ' + (type || ''); }
function label() { $('add').textContent = `Ajouter à ${$('folder').value}`; }

function renderRecent() {
  const list = store.get(RECENT_KEY, []);
  $('recent').hidden = !list.length;
  $('recent-list').innerHTML = list.map(i => `<li>
    ${i.image ? `<img src="${esc(i.image)}" alt="" loading="lazy">` : '<span class="ph"></span>'}
    <span>${esc(i.title || 'Sans titre')}</span>
    <small>${esc(i.folder || '')}</small>
  </li>`).join('');
}

async function loadFolders() {
  const wanted = params.get('dossier') || store.get(FOLDER_KEY, 'A+P');
  try {
    const res = await fetch(`${API_URL}?action=listDossiers`, { credentials: 'omit' });
    const data = JSON.parse(await res.text());
    const names = (data.records || []).map(r => r.fields.Name).filter(Boolean).sort((a, b) => a.localeCompare(b));
    if (names.length) $('folder').innerHTML = names.map(n => `<option ${n === wanted ? 'selected' : ''}>${esc(n)}</option>`).join('');
  } catch (e) { /* on garde A+P par défaut */ }
  label();
}

$('folder').addEventListener('change', () => { store.set(FOLDER_KEY, $('folder').value); label(); });

$('paste').addEventListener('click', async () => {
  try {
    const t = (await navigator.clipboard.readText()).trim();
    const m = t.match(/https?:\/\/[^\s]*vinted\.[a-z.]+\/items\/[^\s]+/i);
    $('link').value = m ? m[0] : t;
    $('link').focus();
  } catch (e) {
    status('Le téléphone refuse le collage automatique : appuie longuement dans le champ puis « Coller ».', 'error');
  }
});

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const raw = $('link').value.trim();
  // Le bouton Partager de l'app Vinted ajoute parfois du texte autour du lien : on extrait le lien.
  const link = (raw.match(/https?:\/\/[^\s]*vinted\.[a-z.]+\/items\/[^\s]+/i) || [raw])[0];
  if (!link) return status('Colle d\'abord un lien Vinted.', 'error');
  if (!/vinted\.[a-z.]+\/items\/\d+/i.test(link)) return status('Ce n\'est pas un lien d\'annonce Vinted (il doit contenir /items/…).', 'error');

  const folder = $('folder').value;
  $('add').disabled = true;
  $('added').innerHTML = '';
  status('Récupération de la pièce sur Vinted…', 'loading');
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      credentials: 'omit',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'addFromVintedLink', link, dossierName: folder }),
    });
    const data = JSON.parse(await res.text());
    if (data.error) throw new Error(data.error);
    status(`Ajoutée à ${folder}.`, 'ok');
    $('added').innerHTML = `<div class="added">
      ${data.image ? `<img src="${esc(data.image)}" alt="">` : '<span></span>'}
      <div><span class="mono soft">${esc(data.brand || '')}</span><div class="t">${esc(data.title || 'Sans titre')}</div></div>
    </div>`;
    const list = store.get(RECENT_KEY, []);
    list.unshift({ title: data.title, image: data.image, folder });
    store.set(RECENT_KEY, list.slice(0, 8));
    renderRecent();
    $('link').value = '';
  } catch (err) {
    // Google peut répondre en erreur alors que l'ajout est fait : on le dit plutôt que de pousser à recommencer.
    status(`Pas de confirmation (${err.message}). Vérifie dans Finds avant de recommencer, la pièce a peut-être été ajoutée.`, 'error');
  } finally {
    $('add').disabled = false;
  }
});

renderRecent();
loadFolders();
</script>
</body>
</html>
