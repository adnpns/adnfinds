<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Ajouter une pièce — A+P</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card-bg: #ffffff;
    --text: #1d1d1f;
    --text-muted: #6e6e73;
    --accent: #0071e3;
    --success: #34c759;
    --danger: #ff3b30;
    --border: #e5e5ea;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--text);
  }
  main {
    max-width: 480px;
    margin: 0 auto;
    padding: 28px 20px 60px;
    min-height: 100vh;
  }
  h1 {
    font-size: 22px;
    margin: 8px 0 4px;
  }
  .subtitle {
    font-size: 14px;
    color: var(--text-muted);
    margin: 0 0 24px;
    line-height: 1.5;
  }
  .card {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  input[type="text"], input[type="url"] {
    width: 100%;
    padding: 14px 14px;
    font-size: 16px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #fafafa;
    color: var(--text);
  }
  input:focus {
    outline: none;
    border-color: var(--accent);
    background: white;
  }
  button {
    width: 100%;
    margin-top: 16px;
    padding: 15px;
    font-size: 16px;
    font-weight: 600;
    color: white;
    background: var(--text);
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; }
  button:active:not(:disabled) { background: #333336; }

  .status {
    margin-top: 18px;
    padding: 14px 16px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.5;
    display: none;
  }
  .status.show { display: block; }
  .status.ok { background: #edfaf0; color: #1c7a34; border: 1px solid #b9ecc6; }
  .status.error { background: #fff1f0; color: #b3261e; border: 1px solid #ffc7c2; }
  .status.loading { background: #eef6ff; color: #0058b8; border: 1px solid #bfe0ff; }

  .preview {
    margin-top: 16px;
    display: none;
    gap: 12px;
    align-items: center;
    background: #fafafa;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
  }
  .preview.show { display: flex; }
  .preview img {
    width: 56px;
    height: 56px;
    border-radius: 8px;
    object-fit: cover;
    background: #eee;
    flex-shrink: 0;
  }
  .preview .info { min-width: 0; }
  .preview .title {
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .preview .brand {
    font-size: 12px;
    color: var(--text-muted);
  }

  .recent {
    margin-top: 28px;
  }
  .recent h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text-muted);
    margin: 0 0 10px;
  }
  .recent-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .recent-item:last-child { border-bottom: none; }
  .recent-item img {
    width: 34px; height: 34px;
    border-radius: 6px;
    object-fit: cover;
    background: #eee;
    flex-shrink: 0;
  }
  .recent-item .rtitle {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
</style>
</head>
<body>

<main>
  <h1>➕ Ajouter une pièce</h1>
  <p class="subtitle">Colle ici le lien Vinted d'une pièce. Elle sera automatiquement ajoutée au dossier <strong>A+P</strong>.</p>

  <div class="card">
    <label for="input-link">Lien Vinted</label>
    <input type="url" id="input-link" inputmode="url" placeholder="https://www.vinted.fr/items/..." autocomplete="off" autocapitalize="off" autocorrect="off">
    <button id="btn-add">Ajouter au dossier A+P</button>

    <div class="preview" id="preview">
      <img id="preview-img" src="" alt="">
      <div class="info">
        <div class="title" id="preview-title"></div>
        <div class="brand" id="preview-brand"></div>
      </div>
    </div>

    <div class="status" id="status"></div>
  </div>

  <div class="recent" id="recent-section" style="display:none;">
    <h2>Dernières pièces ajoutées</h2>
    <div id="recent-list"></div>
  </div>
</main>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbypp-fgmCsLZAovVvFrhbDCRDBrqie6_o3Fm7MAFTmOVd9dGr7ic7jb_fk1A1K_NoXlOw/exec';
  const DOSSIER_NAME = 'A+P';

  const inputLink = document.getElementById('input-link');
  const btnAdd = document.getElementById('btn-add');
  const statusEl = document.getElementById('status');
  const preview = document.getElementById('preview');
  const previewImg = document.getElementById('preview-img');
  const previewTitle = document.getElementById('preview-title');
  const previewBrand = document.getElementById('preview-brand');
  const recentSection = document.getElementById('recent-section');
  const recentList = document.getElementById('recent-list');

  const RECENT_KEY = 'ap_recent_added';

  function showStatus(msg, type) {
    statusEl.textContent = msg;
    statusEl.className = 'status show ' + type;
  }
  function hideStatus() {
    statusEl.className = 'status';
  }
  function showPreview(title, brand, img) {
    previewTitle.textContent = title || 'Sans titre';
    previewBrand.textContent = brand || '';
    previewImg.src = img || '';
    preview.classList.add('show');
  }
  function hidePreview() {
    preview.classList.remove('show');
  }

  function loadRecent() {
    const raw = localStorage.getItem(RECENT_KEY);
    const list = raw ? JSON.parse(raw) : [];
    if (list.length === 0) { recentSection.style.display = 'none'; return; }
    recentSection.style.display = 'block';
    recentList.innerHTML = list.map(item => `
      <div class="recent-item">
        ${item.image ? `<img src="${item.image}" alt="">` : `<div style="width:34px;height:34px;border-radius:6px;background:#eee;flex-shrink:0;"></div>`}
        <div class="rtitle">${item.title || 'Sans titre'}</div>
      </div>
    `).join('');
  }
  function pushRecent(item) {
    const raw = localStorage.getItem(RECENT_KEY);
    const list = raw ? JSON.parse(raw) : [];
    list.unshift(item);
    localStorage.setItem(RECENT_KEY, JSON.stringify(list.slice(0, 8)));
    loadRecent();
  }

  btnAdd.addEventListener('click', async () => {
    const link = inputLink.value.trim();
    if (!link) {
      showStatus('Colle d\'abord un lien Vinted.', 'error');
      return;
    }
    if (!/vinted\.[a-z.]+\/items\//i.test(link)) {
      showStatus('Ça ne ressemble pas à un lien Vinted valide (doit contenir /items/...).', 'error');
      return;
    }

    btnAdd.disabled = true;
    hidePreview();
    showStatus('Récupération des infos de la pièce…', 'loading');

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'addFromVintedLink', link, dossierName: DOSSIER_NAME })
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);

      showPreview(data.title, data.brand, data.image);
      showStatus('✓ Ajoutée au dossier A+P !', 'ok');
      pushRecent({ title: data.title, image: data.image });
      inputLink.value = '';
    } catch (e) {
      showStatus('Erreur : ' + e.message, 'error');
    } finally {
      btnAdd.disabled = false;
    }
  });

  inputLink.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') btnAdd.click();
  });

  loadRecent();
</script>

</body>
</html>
